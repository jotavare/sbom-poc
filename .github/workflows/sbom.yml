name: SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

# Runner: pinned to the OS label, not `ubuntu-latest` (which moves to a new
# Ubuntu release without notice). Hosted runner images can't be pinned by
# digest; GitHub refreshes them weekly. Everything that runs on them is pinned:
# actions by commit SHA, tools and base images by digest.
jobs:
  sbom:
    name: SBOM (${{ matrix.app }})
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write   # upload the vulnerability SARIF to code scanning (a viewer only)
    strategy:
      fail-fast: false
      matrix:
        app: [python, node, go, java, rust]
    env:
      APP: ${{ matrix.app }}
      SBOM_SOURCE_VERSION: ${{ github.sha }}
    # CI runs the same `make` targets as local runs (see Makefile and scripts/)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python SBOM validators (spdx-tools, spdx3-validate, jsonschema-rs, SPDX 3 schema)
      - name: Cache SBOM validators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sbom/.cache/spdx-tools-*
            sbom/.cache/spdx3-validate-*
            sbom/.cache/jsonschema-rs-*
            sbom/.cache/spdx-3.0.1-json-schema.json
          key: py-validators-${{ hashFiles('scripts/validate-sbom.sh') }}

      - name: Tests (Dockerfile test stage)
        timeout-minutes: 15
        run: make test APP="$APP"

      # cdxgen release binary (+ libatomic), keyed by version: downloaded once
      - name: Cache cdxgen binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sbom/.cache/cdxgen-v13.8.0
          key: cdxgen-v13.8.0-linux-amd64

      # static strace for the runtime SBOM, built from source (~60 s): cached by its
      # Dockerfile, so it is rebuilt only when the pinned version changes
      - name: Cache strace
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sbom/.cache/strace-7.3
          key: strace-${{ hashFiles('tools/strace-static/Dockerfile') }}

      # Trivy vulnerability/Java DBs (java: ~920 MB): keyed by day, so a fresh copy
      # is saved once a day instead of being uploaded on every run (~24 s)
      - name: Date for the Trivy cache key
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DBs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sbom/.cache/${{ matrix.app }}/trivy
          key: trivy-${{ matrix.app }}-${{ steps.day.outputs.day }}
          restore-keys: trivy-${{ matrix.app }}-

      # Grype + Trivy vulnerability DBs (shared by all apps), keyed by day
      - name: Cache vulnerability DBs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sbom/.cache/vulndb
          key: vulndb-${{ steps.day.outputs.day }}
          restore-keys: vulndb-

      - name: Generate + check SBOMs (Syft, Trivy, cdxgen, native, BuildKit)
        # each tool call is also limited to 10 min (STEP_TIMEOUT in generate-sbom.sh)
        timeout-minutes: 30
        run: make sbom APP="$APP"

      - name: Runtime SBOM (strace + probes) and unmanaged files
        timeout-minutes: 15
        run: make runtime unmanaged APP="$APP"

      - name: Validate SBOMs (cyclonedx-cli, pyspdxtools, spdx3-validate)
        timeout-minutes: 20
        run: make validate APP="$APP"

      - name: Vulnerability scan of the SBOMs (Grype, Trivy, OSV-Scanner)
        timeout-minutes: 20
        run: make vulns APP="$APP"

      # GitHub code scanning only DISPLAYS the results: the findings, the gate and
      # the SARIF are ours (scripts/vulns-sarif.jq). Not on pull requests from
      # forks, whose token can't write security events.
      - name: Show vulnerabilities in GitHub code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sbom/${{ matrix.app }}/vulns/vulns.sarif
          category: sbom-vulns-${{ matrix.app }}

      - name: Compare, licences, quality
        timeout-minutes: 10
        run: |
          make summary APP="$APP"
          cat "sbom/$APP/reports/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # after the summary, so the report exists even when the gate fails
      - name: Vulnerability gate (critical/high with a fix, not accepted)
        run: make vuln-gate APP="$APP"

      - name: Upload SBOMs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.app }}
          path: |
            sbom/${{ matrix.app }}/
            sbom/.cache/${{ matrix.app }}/*.log
          if-no-files-found: error
          retention-days: 30

  report:
    name: Combined report
    needs: sbom
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: artifacts

      - name: Build sbom/SBOM-REPORT.md
        run: |
          mkdir -p sbom
          for d in artifacts/sbom-*; do
            app="${d#artifacts/sbom-}"
            # artifacts keep the common root: <app>/... (and .cache/<app>/*.log)
            if [[ -d "$d/$app" ]]; then cp -r "$d/$app" sbom/; else cp -r "$d" "sbom/$app"; fi
          done
          make report
          cat sbom/SBOM-REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-report
          path: sbom/SBOM-REPORT.md
          if-no-files-found: error
          retention-days: 30
