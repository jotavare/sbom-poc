[package]
name = "poc-rust"
version = "0.1.0"
edition = "2021"
description = "Deliberately vulnerable HTTP API (DevSecOps PoC). Old dependencies on purpose."
license = "MIT"
publish = false

# Exact pins (=) on purpose: these versions have known advisories.
[dependencies]
tiny_http = "=0.12.0"
regex = "=1.5.4"      # CVE-2022-24713 (ReDoS via crafted patterns)
smallvec = "=1.6.0"   # CVE-2021-25900 (buffer overflow in insert_many)
time = "=0.1.43"      # CVE-2020-26235 (segfault via localtime_r)
md-5 = "=0.10.6"      # current; used to show a weak algorithm

[profile.release]
strip = true
