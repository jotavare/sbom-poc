# Licence policy for application dependencies (checked with anchore/grant).
# Grant denies everything that is not explicitly allowed.
#
# Allowed: permissive licences, plus MPL-2.0 (weak, file-level copyleft;
# e.g. certifi) which is commonly accepted for unmodified dependencies.
# Not allowed (fails the check): GPL/LGPL/AGPL and anything unknown.
allow:
  - MIT
  - MIT-*
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Unlicense
  - Zlib
  - PSF-2.0
  - Python-2.0
  - MPL-2.0
  - EPL-1.0
  - EPL-2.0
  - CC0-1.0
  - Unicode-DFS-2016
  - Unicode-3.0
  - BlueOak-1.0.0

# Every package must declare a licence; "no licence found" is a violation,
# because it means compliance can't be shown.
require-license: true
require-known-license: false
ignore-packages: []
